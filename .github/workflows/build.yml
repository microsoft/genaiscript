name: build
permissions:
    contents: read
    models: read
on:
    push:
        branches: [main, dev]
    pull_request:
    workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22, 23, 24]
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: "recursive"
                  fetch-depth: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: "${{ matrix.node-version }}"
                  cache: 'pnpm'
            - uses: pnpm/action-setup@v2
              with:
                  version: '10.11.0'
            - run: sudo apt-get update && sudo apt-get install ffmpeg
            - run: pnpm install --frozen-lockfile
            - name: build
              run: pnpm run build
            - name: lint:check
              run: pnpm run lint:check
            - name: package vscode
              run: pnpm run package
            - name: compile system scripts
              run: pnpm run test:system
            - name: compile tests
              run: pnpm run test:compile
            - name: core tests
              run: pnpm run --filter=@genaiscript/core test
            - name: unit tests
              run: pnpm run test:samples
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: unit test:modulesamples
              run: pnpm run test:modulesamples
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
